name: ${COMPOSE_PROJECT_NAME:-dut-ai-pr-preview}

services:
  postgres:
    env_file:
      - ${APP_ENV_FILE:-.env}
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    command:
      - postgres
      - -c
      - port=${POSTGRES_INTERNAL_PORT:-5432}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_EXTERNAL_PORT:-3637}:${POSTGRES_INTERNAL_PORT:-5432}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h localhost -p ${POSTGRES_INTERNAL_PORT:-5432}
          -U ${POSTGRES_USER:?POSTGRES_USER is required}
          -d ${POSTGRES_DB:?POSTGRES_DB is required}
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    env_file:
      - ${APP_ENV_FILE:-.env}
    build:
      context: .
      target: production
    command:
      - uvicorn
      - app.server.controller:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - ${WEB_INTERNAL_PORT:-8000}
    volumes:
      - type: volume
        source: sessions
        target: ${DSH_SESSION_ROOT:-/data/sessions}
      - type: bind
        source: ${GITHUB_PRIVATE_KEY_FILE:-./secrets/github-app.pem}
        target: ${GITHUB_PRIVATE_KEY_PATH:-/run/secrets/github-app.pem}
        read_only: true
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_EXTERNAL_PORT:-3636}:${WEB_INTERNAL_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:${WEB_INTERNAL_PORT:-8000}/healthz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    env_file:
      - ${APP_ENV_FILE:-.env}
    build:
      context: .
      target: production
    command: ["python", "-m", "app.worker"]
    volumes:
      - type: volume
        source: sessions
        target: ${DSH_SESSION_ROOT:-/data/sessions}
      - type: bind
        source: ${GITHUB_PRIVATE_KEY_FILE:-./secrets/github-app.pem}
        target: ${GITHUB_PRIVATE_KEY_PATH:-/run/secrets/github-app.pem}
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os; from app.server.repositories import PostgresStore;
          raise SystemExit(0 if PostgresStore(os.environ['DATABASE_URL']).health() else 1)
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  sessions:
