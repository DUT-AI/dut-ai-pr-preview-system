name: dut-ai-pr-preview

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dut_ai_pr_preview
      POSTGRES_USER: dut_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-before-use}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dut_ai -d dut_ai_pr_preview"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: postgresql://dut_ai:${POSTGRES_PASSWORD:-change-before-use}@postgres:5432/dut_ai_pr_preview
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_ALLOWED_REPOSITORIES: ${GITHUB_ALLOWED_REPOSITORIES:-DUT-AI/dut-ai-pr-preview-system}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm2.dutai.site/v1}
      LLM_MODEL: ${LLM_MODEL:-ggml-org/gemma-4-e4b-it-GGUF:Q4_0}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PUBLISH_ENABLED: ${PUBLISH_ENABLED:-false}
      DSH_SESSION_ROOT: /data/sessions
    volumes:
      - sessions:/data/sessions
      - ${GITHUB_PRIVATE_KEY_FILE:-./secrets/github-app.pem}:/run/secrets/github-app.pem:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      target: production
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://dut_ai:${POSTGRES_PASSWORD:-change-before-use}@postgres:5432/dut_ai_pr_preview
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_ALLOWED_REPOSITORIES: ${GITHUB_ALLOWED_REPOSITORIES:-DUT-AI/dut-ai-pr-preview-system}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm2.dutai.site/v1}
      LLM_MODEL: ${LLM_MODEL:-ggml-org/gemma-4-e4b-it-GGUF:Q4_0}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PUBLISH_ENABLED: ${PUBLISH_ENABLED:-false}
      DSH_SESSION_ROOT: /data/sessions
    volumes:
      - sessions:/data/sessions
      - ${GITHUB_PRIVATE_KEY_FILE:-./secrets/github-app.pem}:/run/secrets/github-app.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; from app.server.repositories import PostgresStore; raise SystemExit(0 if PostgresStore(os.environ['DATABASE_URL']).health() else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  sessions:
