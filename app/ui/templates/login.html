{% extends "base.html" %}
{% block title %}Đăng nhập · DUT AI PR Preview{% endblock %}
{% block content %}
<section class="login card">
  <p class="eyebrow">DUT AI CLUB</p>
  <h1>PR Preview System</h1>
  <p class="muted">Dashboard nội bộ dành cho quản trị viên.</p>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Tài khoản<input name="username" value="{{ username }}" autocomplete="username"></label>
    <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" autofocus></label>
    <button type="submit">Đăng nhập</button>
  </form>
</section>
{% endblock %}
